<div class="activity-container">
    <!-- Display the feedback message -->
    <p>{{ feedbackMessage }}</p>
  
    <!-- Display the code structure with blanks -->
    <div *ngFor="let line of codeStructure" class="code-line">
      <span [ngClass]="{ 'correct': line.userAnswer && line.userAnswer.trim().toLowerCase() === line.answer.toLowerCase(), 'incorrect': line.userAnswer && line.userAnswer.trim().toLowerCase() !== line.answer.toLowerCase() }">
        {{ line.line | slice:0:line.line.indexOf('_____') }}
      </span>
      <input [(ngModel)]="line.userAnswer" class="code-input" />
      <span [ngClass]="{ 'correct': line.userAnswer && line.userAnswer.trim().toLowerCase() === line.answer.toLowerCase(), 'incorrect': line.userAnswer && line.userAnswer.trim().toLowerCase() !== line.answer.toLowerCase() }">
        {{ line.line | slice:line.line.indexOf('_____') + 5 }}
      </span>
    </div>
  
    <!-- Submit and Reset buttons -->
    <button (click)="checkAnswers()">Check Answers</button>
    <button (click)="resetActivity()">Reset Activity</button>
  </div>
